services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urkae
      POSTGRES_USER: urkae
      POSTGRES_PASSWORD: urkae
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urkae -d urkae"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - urkae_postgres:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://urkae:urkae@postgres:5432/urkae
      APP_ENV: docker
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  urkae_postgres:


services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urkae_test
      POSTGRES_USER: urkae
      POSTGRES_PASSWORD: urkae
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urkae -d urkae_test"]
      interval: 5s
      timeout: 5s
      retries: 10
